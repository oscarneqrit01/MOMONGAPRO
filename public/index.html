<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOMONGA PRO Multi-Browser</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-top: #0c1823;
      --bg-mid: #0f1f2b;
      --panel: rgba(14, 26, 35, 0.94);
      --panel-2: rgba(18, 33, 44, 0.96);
      --card: rgba(22, 36, 47, 0.96);
      --line: rgba(255, 255, 255, 0.08);
      --muted: #a9b9c9;
      --text: #eaf2ff;
      --green: #50d38c;
      --green-2: #2dbd73;
      --red: #f04d4d;
      --red-2: #d33d4a;
      --orange: #f29a2e;
      --orange-2: #da7e1a;
      --blue: #2c9ae9;
      --blue-2: #167fca;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      --console: rgba(8, 12, 18, 0.83);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0d1418 0%, #182733 100%);
      color: var(--text);
    }

    body {
      padding: 0;
    }

    .phone-shell {
      width: min(100%, 1364px);
      margin: 0 auto;
      min-height: 100vh;
      padding: 0 14px 12px;
      background: linear-gradient(180deg, rgba(9, 14, 17, 0.9), rgba(37, 52, 65, 0.78));
      position: relative;
    }

    .screen {
      width: 100%;
      min-height: calc(100vh - 20px);
      background: linear-gradient(180deg, #060b13 0%, #101a22 100%);
      border-radius: 0 0 14px 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .statusbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 0 18px;
      font-weight: 700;
      background: rgba(18, 24, 30, 0.76);
      color: #fff;
      font-size: 18px;
    }

    .statusbar .time {
      letter-spacing: 0.02em;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      color: #efefef;
    }

    .signal {
      display: flex;
      align-items: end;
      gap: 2px;
      height: 16px;
    }

    .signal span {
      width: 3px;
      border-radius: 2px 2px 0 0;
      background: #fff;
      opacity: 0.9;
      display: inline-block;
    }

    .signal span:nth-child(1) { height: 5px; }
    .signal span:nth-child(2) { height: 8px; }
    .signal span:nth-child(3) { height: 11px; }
    .signal span:nth-child(4) { height: 14px; }

    .battery {
      width: 28px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 3px;
      position: relative;
      display: inline-block;
      margin-left: 2px;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 6px;
      background: #fff;
      border-radius: 1px;
    }

    .battery::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 17px;
      height: 6px;
      background: #fff;
      border-radius: 1px;
    }

    .app-wrap {
      background: rgba(9, 17, 23, 0.96);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 18px 16px 16px;
    }

    .headerbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0 12px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: inline-block;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, #65d6b3, #e6f5ff);
      border-radius: 5px;
      transform: rotate(45deg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(101, 214, 179, 0.4);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 3px;
      background: rgba(13, 25, 35, 0.9);
    }

    .title {
      font-size: clamp(22px, 3vw, 44px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #dfeeff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title .accent {
      color: #8fe3b9;
      text-shadow: 0 0 12px rgba(143, 227, 185, 0.45);
    }

    .title .muted {
      color: #dfeeff;
    }

    .active-box {
      flex-shrink: 0;
      background: rgba(21, 47, 39, 0.85);
      border: 1px solid rgba(116, 223, 166, 0.42);
      color: #a6e7b8;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .control-label {
      font-size: 14px;
      color: #dfeeff;
      letter-spacing: 0.12em;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.9;
      margin-right: 6px;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      min-height: 52px;
      padding: 0 18px;
      font-size: 15px;
      text-transform: uppercase;
      transition: transform 0.15s ease, filter 0.2s ease;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18);
    }

    .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-start {
      background: linear-gradient(180deg, var(--green), var(--green-2));
      color: #f0fff6;
      min-width: 200px;
    }

    .btn-publish {
      background: linear-gradient(180deg, var(--red), var(--red-2));
      min-width: 230px;
    }

    .btn-pause {
      background: linear-gradient(180deg, var(--orange), var(--orange-2));
      min-width: 150px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      margin-bottom: 12px;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #dfeeff;
      opacity: 0.9;
    }

    .section-header .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-header .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #dfeeff;
      opacity: 0.85;
      display: inline-block;
    }

    .add-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.12);
      color: #edf4ff;
      border-radius: 10px;
      min-height: 42px;
      padding: 0 18px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 14px;
    }

    .profiles {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 4px;
    }

    .profile-card {
      background: linear-gradient(180deg, rgba(15, 27, 37, 0.96), rgba(12, 23, 32, 0.96));
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 140px;
      padding: 14px 18px;
      margin-bottom: 18px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .profile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .profile-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: nowrap;
    }

    .profile-name strong {
      font-size: clamp(16px, 1.9vw, 26px);
      font-weight: 800;
      letter-spacing: 0.01em;
      color: #f3f7ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a9b9c9;
      font-size: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .interval-input {
      width: 58px;
      background: #151522;
      border: 1px solid #444;
      color: #f5f7ff;
      text-align: center;
      padding: 4px;
      border-radius: 4px;
      font-size: 12px;
    }

    .profile-repost {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a9b9c9;
      font-size: 11px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .mini-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6be3ad;
      display: inline-block;
      box-shadow: 0 0 12px rgba(107, 227, 173, 0.8);
      margin-right: 4px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .small-btn {
      border: none;
      border-radius: 8px;
      min-height: 34px;
      padding: 0 16px;
      color: #fff;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.04em;
      font-size: 12px;
    }

    .small-btn.green { background: linear-gradient(180deg, #46c876, #2bb069); }
    .small-btn.orange { background: linear-gradient(180deg, #f7a42d, #df891d); }
    .small-btn.red { background: linear-gradient(180deg, #ef5658, #d5413d); }
    .small-btn.blue { background: linear-gradient(180deg, #2ea5ec, #147fe0); }
  .small-btn.amber { background: linear-gradient(180deg, #f7b733, #f39c12); color: #1a1a2e; }

    .subpanel {
      margin-top: 18px;
      background: linear-gradient(180deg, rgba(15, 27, 37, 0.95), rgba(12, 24, 32, 0.99));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 14px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .subpanel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .subpanel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #eaf2ff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 15px;
    }

    .subpanel-title .small-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9fd9ff;
      display: inline-block;
    }

    .subpanel-meta {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      color: #d7ebff;
      font-size: 13px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #eaf2ff;
      font-weight: 700;
    }

    .meta-pill .tiny {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f4d460;
      display: inline-block;
      box-shadow: 0 0 10px rgba(244,212,96,0.8);
    }

    .timer-wrap {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 10px;
      padding: 8px 0 4px;
    }

    .timer-label {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: #d7e7ff;
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .timer {
      font-size: clamp(30px, 3.3vw, 62px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.06em;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #e9f7ff;
      text-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    .note {
      color: #dfeeff;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    .checks {
      margin-top: 16px;
      display: grid;
      gap: 8px;
      color: #dfeeff;
      font-size: 15px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.96;
    }

    .check-item input {
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.45);
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 18px;
      cursor: pointer;
    }

    .check-item input:checked {
      background: rgba(87, 224, 167, 0.18);
      border-color: rgba(87, 224, 167, 0.7);
    }

    .check-item input:checked::after {
      content: "";
      width: 5px;
      height: 9px;
      width: 5px;
      border: solid #6fe5b0;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .actions-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .small-btn.action-green { background: linear-gradient(180deg, #46c876, #2bb069); }
    .small-btn.action-orange { background: linear-gradient(180deg, #f7a42d, #df891d); }
    .small-btn.action-red { background: linear-gradient(180deg, #ef5658, #d5413d); }
    .small-btn.action-blue { background: linear-gradient(180deg, #2ea5ec, #147fe0); }

    .logbox {
      margin-top: 18px;
      background: var(--console);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 12px 10px;
      min-height: 126px;
      max-height: 200px;
      overflow: hidden;
    }

    .profile-card {
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      margin-bottom: 0;
    }

    .profile-top,
    .profile-name,
    .profile-repost,
    .profile-meta,
    .profile-row,
    .subpanel {
      margin-left: 20px;
      margin-right: 20px;
    }

    .profile-top {
      margin: 0;
      padding: 14px 20px 9px;
      background: rgba(8, 10, 20, 0.3);
    }

    .profile-name {
      margin-top: 0;
      padding: 0 20px 12px;
      margin-left: 0;
      margin-right: 0;
      border-bottom: 1px solid var(--line);
    }

    .profile-repost,
    .profile-meta {
      margin-bottom: 7px;
    }

    .profile-repost {
      margin-top: 14px;
    }

    .profile-row {
      order: 5;
      margin-top: 12px;
      margin-bottom: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    .profile-row .small-btn {
      min-height: 40px;
      border-radius: 8px;
      padding: 0 15px;
    }

    .subpanel {
      order: 4;
      margin-top: 8px;
      padding: 12px 0 0;
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      background: transparent !important;
      box-shadow: none;
    }

    .subpanel {
      display: contents;
    }

    .subpanel-top,
    .timer-wrap,
    .note,
    .checks,
    .config-wrapper,
    .logbox {
      width: calc(100% - 40px);
    }

    .subpanel-top,
    .timer-wrap,
    .note {
      order: 3;
    }

    .profile-row {
      order: 4;
    }

    .logbox {
      order: 5;
    }

    .checks {
      order: 6;
    }

    .config-wrapper {
      order: 7;
    }

    .subpanel-top,
    .timer-wrap,
    .note,
    .checks,
    .config-wrapper,
    .logbox {
      margin-left: 0;
      margin-right: 0;
    }

    .subpanel-top {
      padding: 0 0 10px;
    }

    .timer-wrap {
      margin-top: 4px;
      margin-bottom: 7px;
      padding: 5px 0 2px;
    }

    .timer {
      font-size: clamp(28px, 3vw, 48px);
    }

    .checks {
      margin-top: 10px;
      gap: 5px;
      font-size: 12px;
    }

    .logbox {
      margin-top: 10px;
      min-height: 84px;
      max-height: 112px;
    }

    .log-list {
      max-height: 70px;
    }

    .cycle-strip {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 0 20px 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: rgba(8, 10, 20, 0.42);
      color: var(--muted);
      font-size: 11px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .cycle-strip b {
      color: var(--text);
      font-weight: 700;
    }

    .cycle-strip span {
      color: var(--blue);
      font-weight: 800;
    }

    .actions-bottom {
      justify-content: flex-start;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #dce9ff;
      opacity: 0.85;
    }

    .log-list {
      font-family: "Consolas", "Monaco", monospace;
      font-size: 12px;
      line-height: 1.7;
      color: #d6ffdb;
      max-height: 152px;
      overflow: auto;
      padding-right: 6px;
    }

    .log-list div {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .clear-log {
      border: none;
      background: transparent;
      color: #dfeeff;
      cursor: pointer;
      font-weight: 700;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.72);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #142532;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-header h2 { margin: 0; font-size: 20px; }

    .modal-close {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-field { display: grid; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-field input {
      width: 100%;
      min-height: 40px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1720;
      color: var(--text);
      outline: none;
    }
    .form-field input:focus { border-color: #5acb9b; }
    .form-error { min-height: 20px; margin-top: 12px; color: #ff9d9d; font-size: 13px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .modal-actions button {
      min-height: 40px;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .cancel-btn { background: rgba(255,255,255,0.12); }
    .save-btn { background: linear-gradient(180deg, var(--green), var(--green-2)); }

    @media (max-width: 980px) {
      .profiles {
        grid-template-columns: 1fr;
      }

      .title {
        white-space: normal;
      }

      .title-group {
        flex-wrap: wrap;
      }

      .control-row {
        justify-content: flex-start;
      }

      .btn-start, .btn-publish, .btn-pause {
        min-width: 0;
        flex: 1 1 180px;
      }
    }
    /* Visual refresh: graphite, electric blue and warm yellow palette. */
    :root {
      --bg-top: #090b14;
      --bg-mid: #141625;
      --panel: rgba(21, 24, 39, 0.96);
      --panel-2: rgba(32, 35, 56, 0.96);
      --card: rgba(25, 29, 47, 0.98);
      --line: rgba(138, 156, 255, 0.22);
      --muted: #a6a9bb;
      --text: #f2f3fb;
      --green: #8b9cff;
      --green-2: #7184ed;
      --red: #ff6b7a;
      --red-2: #dc4f62;
      --orange: #ffc857;
      --orange-2: #d99b29;
      --blue: #61d4ff;
      --blue-2: #3299c6;
      --shadow: 0 20px 45px rgba(0, 0, 0, 0.42);
      --console: rgba(7, 9, 18, 0.9);
    }

    html, body {
      background: radial-gradient(circle at 15% 0, #303552 0%, #141625 38%, #080912 100%);
    }

    .phone-shell,
    .screen,
    .app-wrap {
      background: linear-gradient(180deg, rgba(12, 14, 25, 0.96), rgba(20, 22, 37, 0.96));
    }

    .active-box {
      background: rgba(32, 39, 70, 0.9);
      border-color: rgba(139, 156, 255, 0.55);
      color: #b8c1ff;
    }

    .profile-card,
    .subpanel,
    .config-wrapper {
      background: linear-gradient(145deg, #202338, #121522) !important;
      border-color: var(--line) !important;
    }

    .profile-card {
      box-shadow: var(--shadow);
    }

    .profile-top,
    .subpanel-top,
    .log-header {
      border-color: var(--line) !important;
    }

    .timer,
    .timer-wrap strong,
    .profile-repost strong {
      color: var(--blue) !important;
    }

    .btn-start,
    .btn-publish,
    .btn-pause,
    .small-btn.green,
    .small-btn.red,
    .small-btn.orange,
    .small-btn.blue {
      filter: saturate(0.95);
    }

    .btn-start,
    .small-btn.green {
      background: linear-gradient(180deg, var(--green), var(--green-2));
    }

    .btn-pause,
    .small-btn.orange {
      background: linear-gradient(180deg, var(--orange), var(--orange-2));
      color: #17120a;
    }

    .btn-publish,
    .small-btn.red {
      background: linear-gradient(180deg, var(--red), var(--red-2));
    }

    .small-btn.blue {
      background: linear-gradient(180deg, var(--blue), var(--blue-2));
    }

    .logbox {
      background: var(--console) !important;
      border-color: var(--line) !important;
    }

    /* Match the approved preview composition while keeping all existing controls. */
    .statusbar {
      display: none;
    }

    .phone-shell {
      padding-top: 20px;
    }

    .cycle-strip {
      gap: 8px;
      font-size: 0;
    }

    .cycle-strip b:first-child {
      display: none;
    }

    .cycle-strip span {
      display: inline-grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #3b477e;
      color: #dfe4ff;
      font-size: 11px;
    }

    .cycle-strip span:nth-of-type(4) {
      background: #705725;
      color: #ffc857;
    }

    .cycle-strip em {
      color: var(--muted);
      font-size: 11px;
      font-style: normal;
    }

    .cycle-strip b:not(:first-child) {
      display: inline;
      color: var(--line);
      font-size: 12px;
    }

    .cycle-strip {
      color: var(--muted);
    }

    .timer-wrap {
      background: #080d16;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 15px 11px;
      text-align: left;
    }

    .timer-wrap .timer-label {
      margin-bottom: 5px;
      text-align: left;
    }

    .timer-wrap .timer {
      text-align: right;
      margin-top: -22px;
    }

    .subpanel-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: 100%;
    }

    .meta-pill {
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(16, 33, 40, 0.72);
    }

    .actions-bottom,
    .profile-row {
      gap: 8px;
    }

    .profile-row .small-btn {
      flex: 1 1 130px;
    }
    /* Final polish layer. */
    .profile-card {
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .profile-card:hover {
      border-color: rgba(97, 212, 255, 0.5);
      transform: translateY(-2px);
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
    }

    .profile-name span[data-state-id] {
      flex: 0 0 auto;
      margin-left: auto !important;
      padding: 6px 9px;
      border: 1px solid rgba(139, 156, 255, 0.35);
      border-radius: 999px;
      background: rgba(59, 71, 126, 0.28);
      color: #b8c1ff !important;
      font-size: 10px !important;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .profile-repost,

      padding: 7px 9px;
      border: 1px solid rgba(138, 156, 255, 0.14);
      border-radius: 8px;
      background: rgba(8, 10, 20, 0.22);
    }

    .profile-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .profile-row .small-btn {
      width: 100%;
    }

    .btn-export {
      background: #292d43;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .cycle-strip [data-cycle-step].active {
      background: var(--cyan);

    @media (max-width: 980px) {

    }

      .profile-row { grid-template-columns: 1fr; }

  <script>
    const socket = io();
    const profileStates = {};
    const profileStats = {};
    const profileStages = {};

    const profileLogs = {};
    const profilesEl = document.getElementById('profiles');
    const activeCountEl = document.getElementById('active-count');
    const addModal = document.getElementById('addModal');
    const addProfileForm = document.getElementById('addProfileForm');
    const formError = document.getElementById('formError');
    const passwordModal = document.getElementById('passwordModal');
    const passwordForm = document.getElementById('passwordForm');
    const passwordFormError = document.getElementById('passwordFormError');
    const appealsModal = document.getElementById('appealsModal');
    const appealsList = document.getElementById('appealsList');
    const healthModal = document.getElementById('healthModal');
    const healthList = document.getElementById('healthList');
    const notifyModal = document.getElementById('notifyModal');
    const notifyForm = document.getElementById('notifyForm');
    const notifyFormError = document.getElementById('notifyFormError');
    const pendingSettingsSaves = {};

    function openAddModal() {
      formError.textContent = '';
      addModal.classList.add('open');
      document.getElementById('profileId').focus();
    }

    function closeAddModal() {
      addModal.classList.remove('open');
    }

    function openPasswordModal() {
      passwordFormError.textContent = '';
      passwordForm.reset();
      passwordModal.classList.add('open');
      document.getElementById('currentPassword').focus();
    }

    function closePasswordModal() {
      passwordModal.classList.remove('open');
    }

    function formatAppealDate(value) {
      try { return new Date(value).toLocaleString(); } catch (_) { return value || ''; }
    }

    function renderAppeals(records) {
      appealsList.innerHTML = '';
      if (!records || records.length === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'color:#aaa;font-size:13px;padding:10px;';
        empty.textContent = 'No hay bloqueos registrados.';
        appealsList.appendChild(empty);
        return;
      }

      records.forEach((record) => {
        const item = document.createElement('div');
        item.style.cssText = 'border:1px solid #2a2a40;border-radius:8px;padding:10px;background:#151522;';

        const title = document.createElement('div');
        title.style.cssText = 'font-weight:bold;color:#e74c3c;font-size:13px;margin-bottom:4px;';
        title.textContent = `${record.profile || ''} · ${formatAppealDate(record.at)}`;

        const meta = document.createElement('div');
        meta.style.cssText = 'color:#bbb;font-size:12px;margin-bottom:6px;';
        meta.textContent = `${record.account || 'sin correo'} · ${record.reason || ''}`;

        const detail = document.createElement('div');
        detail.style.cssText = 'color:#888;font-size:11px;margin-bottom:8px;word-break:break-word;';
        detail.textContent = `${record.message || ''} ${record.url || ''}`.trim();

        const actions = document.createElement('div');
        actions.style.cssText = 'display:flex;gap:8px;flex-wrap:wrap;';

        if (record.screenshot) {
          const shotUrl = `/api/appeals/${encodeURIComponent(record.screenshot)}`;

          const view = document.createElement('button');
          view.className = 'small-btn blue';
          view.textContent = 'Ver captura';
          view.addEventListener('click', () => window.open(shotUrl, '_blank'));
          actions.appendChild(view);

          const download = document.createElement('button');
          download.className = 'small-btn';
          download.textContent = 'Descargar captura';
          download.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = shotUrl;
            link.download = record.screenshot;
            document.body.appendChild(link);
            link.click();
            link.remove();
          });
          actions.appendChild(download);

          const copyShot = document.createElement('button');
          copyShot.className = 'small-btn';
          copyShot.textContent = 'Copiar captura';
          copyShot.addEventListener('click', async () => {
            try {
              const blob = await (await fetch(shotUrl)).blob();
              await navigator.clipboard.write([new ClipboardItem({ [blob.type]: blob })]);
              copyShot.textContent = '✅ Copiada';
              setTimeout(() => { copyShot.textContent = 'Copiar captura'; }, 2000);
            } catch (error) {
              alert('❌ No se pudo copiar la imagen. Usa "Descargar captura".');
            }
          });
          actions.appendChild(copyShot);
        }

        const copy = document.createElement('button');
        copy.className = 'small-btn green';
        copy.textContent = 'Copiar apelación';
        copy.addEventListener('click', async () => {
          try {
            const res = await fetch(`/api/appeals/${encodeURIComponent(record.id)}/draft`);
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'No se pudo generar la apelación.');
            await navigator.clipboard.writeText(data.draft);
            copy.textContent = '✅ Copiado';
            setTimeout(() => { copy.textContent = 'Copiar apelación'; }, 2000);
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });
        actions.appendChild(copy);

        const support = document.createElement('button');
        support.className = 'small-btn';
        support.textContent = 'Abrir soporte';
        support.addEventListener('click', async () => {
          try {
            const res = await fetch(`/api/appeals/${encodeURIComponent(record.id)}/draft`);
            const data = await res.json();
            if (data.supportUrl) socket.emit('open-in-profile', { id: record.profile, url: data.supportUrl });
            else alert('No se pudo determinar la URL de soporte del sitio.');
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });
        actions.appendChild(support);

        const emailBtn = document.createElement('button');
        emailBtn.className = 'small-btn green';
        emailBtn.textContent = 'Enviar por correo (Outlook)';
        emailBtn.addEventListener('click', async () => {
          try {
            const res = await fetch(`/api/appeals/${encodeURIComponent(record.id)}/draft`);
            const data = await res.json();
            if (data.outlookUrl) socket.emit('open-in-profile', { id: record.profile, url: data.outlookUrl });
            else alert('Configura el "Correo de soporte" de este navegador en su Configuración.');
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });
        actions.appendChild(emailBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'small-btn red';
        delBtn.textContent = 'Eliminar';
        delBtn.addEventListener('click', async () => {
          if (!confirm('¿Eliminar este bloqueo detectado?')) return;
          try {
            const res = await fetch(`/api/appeals/${encodeURIComponent(record.id)}`, { method: 'DELETE' });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'No se pudo eliminar.');
            openAppealsModal();
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });
        actions.appendChild(delBtn);

        item.append(title, meta, detail, actions);
        appealsList.appendChild(item);
      });
    }

    function fmtTime(ms) {
      if (!ms) return '—';
      try { return new Date(ms).toLocaleString(); } catch (_) { return '—'; }
    }

    function renderHealth(data) {
      healthList.innerHTML = '';
      const tc = data.twoCaptcha || {};
      const head = document.createElement('div');
      head.style.cssText = 'border:1px solid #2a2a40;border-radius:8px;padding:10px;background:#151522;font-size:12px;color:#ddd;';
      const saldo = tc.balance === null || tc.balance === undefined ? 'desconocido' : `$${Number(tc.balance).toFixed(2)}`;
      head.innerHTML = `<b style="color:#4ecca3;">2Captcha</b> · saldo: <b>${saldo}</b> · resueltos: ${tc.solves || 0} · fallidos: ${tc.fails || 0} <span style="color:#888;">(actualizado ${fmtTime(tc.lastBalanceAt)})</span>`;
      healthList.appendChild(head);

      (data.profiles || []).forEach((p) => {
        const item = document.createElement('div');
        item.style.cssText = 'border:1px solid #2a2a40;border-radius:8px;padding:10px;background:#151522;font-size:12px;color:#ddd;';
        const warnColor = p.lastError ? '#e74c3c' : (p.warnings && p.warnings.length ? '#f39c12' : '#4ecca3');
        const estado = p.started ? (p.paused ? 'pausado' : 'activo') : 'detenido';
        item.innerHTML = `
          <div style="font-weight:bold;color:${warnColor};margin-bottom:4px;">${p.id} · ${estado}</div>
          <div style="color:#aaa;">Última operación: ${p.lastOperation || '—'} (${fmtTime(p.lastOperationAt)})</div>
          <div style="color:#aaa;">Última OK: ${fmtTime(p.lastOkAt)} · Errores: ${p.errors || 0}</div>
          ${p.lastError ? `<div style="color:#e74c3c;margin-top:3px;">Último error: ${p.lastError}</div>` : ''}
          ${(p.warnings || []).length ? `<div style="color:#f39c12;margin-top:3px;">Avisos: ${(p.warnings || []).map((w) => w.message).join(' | ')}</div>` : ''}
          <div style="color:#888;margin-top:3px;">Bumps hoy: ${p.bumpsToday || 0}${p.dailyLimit ? ` / ${p.dailyLimit}` : ''} ${p.proxy ? `· Proxy ${p.proxy}` : ''}</div>
        `;
        healthList.appendChild(item);
      });
      if (!(data.profiles || []).length) {
        const empty = document.createElement('div');
        empty.style.cssText = 'color:#aaa;font-size:13px;padding:10px;';
        empty.textContent = 'Sin perfiles.';
        healthList.appendChild(empty);
      }
    }

                  <div>

                    <span style="font-size: 10px; color: #888;">Repetir este proceso automáticamente cada cierto tiempo:</span>
                  </div>
                  <div style="display: flex; align-items: center; gap: 8px;">
                    <input type="number" id="interval-${profile.id}" value="${profile.repostIntervalMin || ((profile.repostInterval || 6) * 60)}" min="1" max="43200" style="width: 60px; background: #151522; border: 1px solid #444; color: #fff; text-align: center; padding: 5px; border-radius: 4px; font-size: 12px;">
                    <span style="font-size: 11px; color: #ccc;">min</span>
                    <button onclick="toggleAutoRepost('${profile.id}')" id="btn-repost-toggle-${profile.id}" data-active="${profile.autoRepostActive ? 'true' : 'false'}" style="background: ${profile.autoRepostActive ? '#e74c3c' : '#27ae60'}; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;">
                      ${profile.autoRepostActive ? '⏹️ Detener Ciclo' : '▶️ Activar Ciclo'}
                    </button>

                    <button onclick="saveProfileConfig('${profile.id}')" style="background: #4ecca3; color: #000; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;">💾 Guardar Cambios</button>
                    <button onclick="scrapeActiveAd('${profile.id}')" style="background: #3498db; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;">📥 Copiar Datos del Post Actual</button>
                  </div>
                  <button onclick="deleteProfile('${profile.id}')" style="background: #e74c3c; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;">🗑️ Eliminar Perfil</button>

            <div class="logbox">
              <div class="log-header">
                <span>Registro de actividad en vivo</span>
                <span>
                  <select data-log-filter="${profile.id}" aria-label="Filtrar logs">
                    <option value="all">Todos</option>
                    <option value="success">OK</option>
                    <option value="warning">Avisos</option>
                    <option value="error">Errores</option>
                  </select>
                  <button class="clear-log" data-clear-id="${profile.id}">Limpiar</button>

        `;

        profilesEl.appendChild(card);

        const logBox = card.querySelector('.log-list');
        const buffered = profileLogs[profile.id] || [];
        if (buffered.length === 0) {
          const line = document.createElement('div');
          line.textContent = '[Sistema] Interfaz lista y sincronizada con el backend.';
          logBox.appendChild(line);
        } else {
          buffered.slice(-300).forEach((entry) => {
            const line = document.createElement('div');
            line.textContent = `[${entry.stamp}] ${entry.text}`;
            line.dataset.logLevel = entry.level || 'info';
            logBox.appendChild(line);
          });
        }
        logBox.scrollTop = logBox.scrollHeight;
      }

      for (const id of Object.keys(profileStates)) updateProfileState(id, profileStates[id]);
      for (const id of Object.keys(profileStats)) updateStats(id, profileStats[id]);
      for (const id of Object.keys(profileRepostTimers)) updateRepostTimer(id, profileRepostTimers[id]);

      profilesEl.querySelectorAll('[data-action]').forEach(button => {
        button.addEventListener('click', async () => {
          const id = button.dataset.id;
          const action = button.dataset.action;

          if (pendingSettingsSaves[id]) {
            await pendingSettingsSaves[id].catch(() => {});
          }

          if (action === 'open') socket.emit('open-profile', id);
          if (action === 'start') socket.emit('start-profile', id);
          if (action === 'pause') socket.emit('pause-profile', id);
          if (action === 'stop') socket.emit('stop-profile', id);
          if (action === 'publish') socket.emit('publish-profile', id);
          if (action === 'retry') socket.emit('retry-profile', id);
          if (action === 'appeal') socket.emit('appeal-profile', id);
          if (action === 'safety') socket.emit('safety-check-now', id);
          if (action === 'pixelscan') socket.emit('open-in-profile', { id, url: 'https://pixelscan.net/' });
          if (action === 'rename') {
            const newName = prompt('Nuevo nombre para el perfil:', id);
            if (newName === null) return;
            const clean = newName.trim();
            if (!clean || clean === id) return;
            try {
              const resp = await fetch(`/api/profiles/${encodeURIComponent(id)}/rename`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ newId: clean })
              });
              const data = await resp.json().catch(() => ({}));
              if (!resp.ok) alert(data.error || 'No se pudo renombrar el perfil.');
            } catch (error) {
              alert('No se pudo renombrar: ' + error.message);
            }
          }
          if (action === 'save-interval') {
            const minInput = document.querySelector(`[data-bump-min="${id}"]`);
            const maxInput = document.querySelector(`[data-bump-max="${id}"]`);
            const min = Number(minInput && minInput.value) || 16;
            const max = Number(maxInput && maxInput.value) || min;
            socket.emit('update-interval', { id, min: Math.max(1, min), max: Math.max(min, max) });
          }
          if (action === 'save-repost') {
            const minutesInput = document.querySelector(`[data-repost-minutes="${id}"]`);
            const minutes = Number(minutesInput && minutesInput.value) || 360;
            socket.emit('update-repost-interval', { id, minutes: Math.max(1, minutes) });
          }
        });
      });

      profilesEl.querySelectorAll('[data-clear-id]').forEach(button => {
        button.addEventListener('click', () => {
          const id = button.dataset.clearId;
          profileLogs[id] = [];
          const log = document.querySelector(`[data-log-id="${id}"]`);
          if (log) log.innerHTML = '';
        });
      });

      profilesEl.querySelectorAll('[data-log-filter]').forEach((select) => {
        select.addEventListener('change', () => {
          const log = document.querySelector(`[data-log-id="${select.dataset.logFilter}"]`);
          if (!log) return;
          log.querySelectorAll('[data-log-level]').forEach((line) => {
            line.hidden = select.value !== 'all' && line.dataset.logLevel !== select.value;
          });
        });
      });

      profilesEl.querySelectorAll('[data-setting]').forEach(input => {
        input.addEventListener('change', async () => {
          const profileId = input.dataset.id;
          const settings = {};
          profilesEl.querySelectorAll(`[data-setting][data-id="${profileId}"]`).forEach(option => {
            settings[option.dataset.setting] = option.checked;
          });

          const save = (async () => {
            const response = await fetch(`/api/profiles/${encodeURIComponent(profileId)}/settings`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(settings)
            });
            if (!response.ok) {
              const result = await response.json();
              throw new Error(result.error || 'No se pudo guardar la opción.');
            }
          })();

          pendingSettingsSaves[profileId] = save;
          try {
            await save;
          } catch (error) {
            input.checked = !input.checked;
            console.error(error.message);
          } finally {
            if (pendingSettingsSaves[profileId] === save) delete pendingSettingsSaves[profileId];
          }
        });
      });

      profilesEl.querySelectorAll('[data-device-id]').forEach(select => {
        select.addEventListener('change', async () => {
          const profileId = select.dataset.deviceId;
          try {
            const response = await fetch(`/api/profiles/${encodeURIComponent(profileId)}/settings`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ device: select.value })
            });
            if (!response.ok) {
              const result = await response.json();
              throw new Error(result.error || 'No se pudo guardar el dispositivo.');
            }
          } catch (error) {
            alert('❌ ' + error.message);
          }
        });
      });
    }

    function toggleConfig(profileId) {
      const body = document.getElementById(`config-body-${profileId}`);
      const icon = document.getElementById(`toggle-icon-${profileId}`);
      if (!body || !icon) return;
      if (body.style.display === 'none') {
        body.style.display = 'block';
        icon.innerText = '▼ Minimizar';
      } else {
        body.style.display = 'none';
        icon.innerText = '▶ Mostrar Configuración';
      }
    }

    async function deleteProfile(profileId) {
      if (!confirm(`¿Estás seguro de eliminar el perfil ${profileId}? Se borrarán sus datos asociados del panel.`)) return;
      try {
        const res = await fetch(`/api/profiles/${profileId}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          alert('🗑️ Perfil eliminado correctamente.');
          loadProfiles(); // Recargar la lista
        } else {
          alert('❌ No se pudo eliminar el perfil.');
        }
      } catch (e) {
        console.error(e);
        alert('❌ Error de red al eliminar.');
      }
    }

    async function scrapeActiveAd(profileId) {
      alert('📥 Leyendo la página actual (SOLO LECTURA). Abre primero el anuncio en la ventana del navegador para copiar sus datos.');
      try {
        const res = await fetch(`/api/profiles/${encodeURIComponent(profileId)}/scrape`, { method: 'POST' });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || 'No se pudieron copiar los datos.');

        const { name, headline, city, age, location, phone, text, photosPath, photosSaved } = result.data || {};
        if (name) document.getElementById(`name-${profileId}`).value = name;
        if (headline) document.getElementById(`headline-${profileId}`).value = headline;
        if (city) document.getElementById(`city-${profileId}`).value = city;
        if (age) document.getElementById(`age-${profileId}`).value = age;
        if (location) document.getElementById(`location-${profileId}`).value = location;
        if (phone) document.getElementById(`phone-${profileId}`).value = phone;
        if (text) document.getElementById(`text-${profileId}`).value = text;
        if (photosPath) document.getElementById(`photos-${profileId}`).value = photosPath;
        if (photosSaved) alert(`📥 ${photosSaved} foto(s) copiadas y blindadas. Revisa y pulsa Guardar Cambios.`);
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }

    function applyRepostToggle(profileId, active) {
      const btn = document.getElementById(`btn-repost-toggle-${profileId}`);
      if (!btn) return;
      btn.dataset.active = active ? 'true' : 'false';
      btn.style.background = active ? '#e74c3c' : '#27ae60';
      btn.innerText = active ? '⏹️ Detener Ciclo' : '▶️ Activar Ciclo';
    }

    async function toggleAutoRepost(profileId) {
      const btn = document.getElementById(`btn-repost-toggle-${profileId}`);
      const intervalInput = document.getElementById(`interval-${profileId}`);
      const interval = Number(intervalInput.value) || 6;
      const activating = btn.dataset.active !== 'true';

      try {
        const res = await fetch(`/api/profiles/${encodeURIComponent(profileId)}/autorepost`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ autoRepostActive: activating, repostInterval: interval })
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || 'No se pudo actualizar el ciclo.');
        applyRepostToggle(profileId, result.autoRepostActive);
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }

    async function saveProfileConfig(profileId) {
      const proxyHostVal = String(document.getElementById(`proxyHost-${profileId}`)?.value || '').trim();
      const data = {
        proxy: proxyHostVal ? {
          host: proxyHostVal,
          port: Number(document.getElementById(`proxyPort-${profileId}`)?.value) || 0,
          username: String(document.getElementById(`proxyUser-${profileId}`)?.value || '').trim(),
          password: String(document.getElementById(`proxyPass-${profileId}`)?.value || ''),
          type: document.getElementById(`proxyType-${profileId}`)?.value || 'http'
        } : null,
        apiKey2Captcha: document.getElementById(`cap-${profileId}`).value,
        supportEmail: document.getElementById(`supportEmail-${profileId}`).value,
        limits: {
          dailyLimit: Number(document.getElementById(`dailyLimit-${profileId}`)?.value) || 0,
          conservativeMode: false
        },
        email: document.getElementById(`email-${profileId}`).value,
        password: document.getElementById(`pass-${profileId}`).value,
        adDetails: {
          name: document.getElementById(`name-${profileId}`).value,
          headline: document.getElementById(`headline-${profileId}`).value,
          city: document.getElementById(`city-${profileId}`).value,
          age: document.getElementById(`age-${profileId}`).value,
          location: document.getElementById(`location-${profileId}`).value,
          phone: document.getElementById(`phone-${profileId}`).value,
          photosPath: document.getElementById(`photos-${profileId}`).value,
          text: document.getElementById(`text-${profileId}`).value,
          textVariants: (document.getElementById(`textVariants-${profileId}`)?.value || '').split(/\n-{3,}\n/).map((s) => s.trim()).filter(Boolean),
          headlineVariants: (document.getElementById(`headlineVariants-${profileId}`)?.value || '').split('\n').map((s) => s.trim()).filter(Boolean)
        }
      };

      try {
        const res = await fetch(`/api/profiles/${profileId}/settings`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.success) {
          alert('✅ ¡Configuración guardada y actualizada con éxito!');
        } else {
          alert('❌ Error al guardar.');
        }
      } catch (e) {
        console.error(e);
        alert('❌ Error de red al guardar la configuración.');
      }
    }

    socket.on('connect', () => {
      loadProfiles();
    });

    socket.on('timer', (data) => {
      const timerNode = document.querySelector(`[data-timer-id="${data.id}"]`);
      if (timerNode) timerNode.textContent = data.time || '--:--';
    });

    function updateRepostTimer(profileId, time) {
      profileRepostTimers[profileId] = time;
      const node = document.querySelector(`[data-repost-timer-id="${profileId}"]`);
      if (node) node.textContent = time || '--:--';
    }

    socket.on('repost-timer', (data) => {
      updateRepostTimer(data.id, data.time);
    });

    socket.on('log', (data) => {
      const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const entry = { text: data.text, level: data.level || 'info', stamp };
      if (!profileLogs[data.id]) profileLogs[data.id] = [];
      profileLogs[data.id].push(entry);
      if (profileLogs[data.id].length > 300) profileLogs[data.id].splice(0, profileLogs[data.id].length - 300);

      const logBox = document.querySelector(`[data-log-id="${data.id}"]`);
      if (logBox) {
        const line = document.createElement('div');
        line.textContent = `[${stamp}] ${data.text}`;
        line.dataset.logLevel = entry.level;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
      }
    });

    socket.on('active-count', (data) => {
      activeCountEl.textContent = `${data.active} Navegadores Activos`;
    });

    socket.on('profiles-updated', (profiles) => {
      renderProfiles(profiles);
    });

    function updateProfileState(profileId, state) {
      profileStates[profileId] = state;
      const card = document.querySelector(`[data-card-id="${profileId}"]`);
      if (!card) return;

      const labels = { running: '● Activo', paused: '● Pausado', ready: '● Abierto', stopped: '● Detenido' };
      const colors = { running: '#4ecca3', paused: '#f5a623', ready: '#6c5ce7', stopped: '#888' };
      const badge = card.querySelector(`[data-state-id="${profileId}"]`);
      if (badge) {
        badge.textContent = labels[state] || labels.stopped;
        badge.style.color = colors[state] || colors.stopped;
      }

      const hasBrowser = state !== 'stopped';
      card.querySelectorAll('[data-action="open"]').forEach(btn => { btn.disabled = hasBrowser; });
      card.querySelectorAll('[data-action="start"]').forEach(btn => { btn.disabled = state === 'running'; });
      card.querySelectorAll('[data-action="pause"]').forEach(btn => {
        btn.disabled = state === 'stopped' || state === 'ready';
        btn.textContent = state === 'paused' ? 'Reanudar' : 'Pausar';
      });
      card.querySelectorAll('[data-action="stop"]').forEach(btn => { btn.disabled = state === 'stopped'; });
      card.querySelectorAll('[data-action="publish"]').forEach(btn => { btn.disabled = state === 'stopped' || state === 'ready'; });
    }

    function updateStats(profileId, stats) {
      profileStats[profileId] = stats;
      const pill = document.querySelector(`[data-stats-id="${profileId}"]`);
      if (pill) {
        pill.textContent = `Bumps hoy: ${stats.bumpsToday || 0} · Total: ${stats.totalBumps || 0}`;
      }
      const note = document.querySelector(`[data-lastbump-id="${profileId}"]`);
      if (note) {
        note.textContent = stats.lastBumpAt
          ? `Último bump: ${new Date(stats.lastBumpAt).toLocaleString()}`
          : 'Sin publicaciones registradas aún';
      }
    }

    socket.on('profile-state', (data) => {
      updateProfileState(data.id, data.state);
    });

    socket.on('stats', (data) => {
      updateStats(data.id, data.stats);
    });

    function updateCycleStage(profileId, stage, detail) {
      profileStages[profileId] = { stage, detail };
      const strip = document.querySelector(`[data-cycle-id="${profileId}"]`);
      if (!strip) return;
      const order = ['removing', 'filling', 'city', 'photos', 'captcha', 'publishing', 'completed'];
      const current = order.indexOf(stage);
      strip.querySelectorAll('[data-cycle-step]').forEach((step) => {
        const index = order.indexOf(step.dataset.cycleStep);
        step.classList.toggle('active', step.dataset.cycleStep === stage);
        step.classList.toggle('done', current >= 0 && index >= 0 && index < current);
      });
      const card = document.querySelector(`[data-card-id="${profileId}"]`);
      const note = card?.querySelector(`[data-lastbump-id="${profileId}"]`);
      if (note && detail) note.textContent = detail;
    }

    socket.on('cycle-stage', (data) => {
      updateCycleStage(data.id, data.stage, data.detail);
    });

    function showEmergencyBanner(reason) {
      let banner = document.getElementById('emergency-banner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'emergency-banner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#e74c3c;color:#fff;padding:14px 16px;text-align:center;font-weight:bold;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.5);';
        document.body.appendChild(banner);
      }
      banner.textContent = `⏸ PAUSA DE SEGURIDAD — ${reason} — Perfiles en pausa (los navegadores quedan abiertos).`;
      clearTimeout(banner._hideTimer);
      banner._hideTimer = setTimeout(() => banner.remove(), 30000);
    }

    socket.on('emergency-stop', (data) => {
      showEmergencyBanner((data && data.reason) || 'Bloqueo detectado');
    });

    function showComplianceBanner(id, reasons) {
      let banner = document.getElementById('compliance-banner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'compliance-banner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99998;background:#f39c12;color:#1a1a2e;padding:12px 16px;text-align:center;font-weight:bold;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.4);';
        document.body.appendChild(banner);
      }
      banner.textContent = `⚠️ Cumplimiento [${id}]: ${reasons}. (El intervalo se mantiene como lo configuraste.)`;
      clearTimeout(banner._hideTimer);
      banner._hideTimer = setTimeout(() => banner.remove(), 20000);
    }

    socket.on('compliance-warning', (data) => {
      if (!data) return;
      showComplianceBanner(data.id, (data.reasons || []).join('; '));
    });

    document.getElementById('startAllBtn').addEventListener('click', async () => {
      await Promise.all(Object.values(pendingSettingsSaves).map((save) => save.catch(() => {})));
      socket.emit('start-all');
    });

    document.getElementById('publishAllBtn').addEventListener('click', () => {
      socket.emit('publish-all');
    });

    document.getElementById('pauseAllBtn').addEventListener('click', () => {
      socket.emit('pause-all');
    });

    document.getElementById('exportLogsBtn').addEventListener('click', () => {
      const lines = Array.from(document.querySelectorAll('.log-list > div')).map((line) => line.textContent);
      const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `momonga-logs-${new Date().toISOString().slice(0, 10)}.txt`;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    document.getElementById('exportProfilesBtn').addEventListener('click', () => {
      window.location.href = '/api/profiles/export';
    });

    const importProfilesInput = document.getElementById('importProfilesInput');
    document.getElementById('importProfilesBtn').addEventListener('click', () => importProfilesInput.click());
    importProfilesInput.addEventListener('change', async () => {
      const file = importProfilesInput.files && importProfilesInput.files[0];
      importProfilesInput.value = '';
      if (!file) return;
      try {
        const text = await file.text();
        const parsed = JSON.parse(text);
        const profiles = Array.isArray(parsed) ? parsed : parsed.profiles;
        if (!Array.isArray(profiles) || profiles.length === 0) throw new Error('El archivo no tiene perfiles.');
        if (!confirm(`¿Importar ${profiles.length} perfil(es)? Se actualizarán los que tengan el mismo nombre.`)) return;
        const res = await fetch('/api/profiles/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ profiles }) });
        const result = await res.json();
        if (!res.ok || !result.success) throw new Error(result.error || 'No se pudo importar.');
        alert(`✅ Importado: ${result.added} nuevo(s), ${result.updated} actualizado(s).`);
        await loadProfiles();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    });

    document.querySelector('.add-btn').addEventListener('click', openAddModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeAddModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeAddModal);
    addModal.addEventListener('click', (event) => {
      if (event.target === addModal) closeAddModal();
    });

    document.getElementById('changePasswordBtn').addEventListener('click', openPasswordModal);
    document.getElementById('closePasswordModalBtn').addEventListener('click', closePasswordModal);
    document.getElementById('cancelPasswordModalBtn').addEventListener('click', closePasswordModal);
    passwordModal.addEventListener('click', (event) => {
      if (event.target === passwordModal) closePasswordModal();
    });

    passwordForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      passwordFormError.textContent = '';
      const form = new FormData(passwordForm);
      const currentPassword = String(form.get('currentPassword') || '');
      const newPassword = String(form.get('newPassword') || '');
      const confirmPassword = String(form.get('confirmPassword') || '');

      if (newPassword !== confirmPassword) {
        passwordFormError.textContent = 'Las contraseñas nuevas no coinciden.';
        return;
      }
      if (newPassword.length < 8) {
        passwordFormError.textContent = 'La nueva contraseña debe tener al menos 8 caracteres.';
        return;
      }

      try {
        const response = await fetch('/api/security/password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword, newPassword })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.error || 'No se pudo cambiar la contraseña.');
        closePasswordModal();
        alert('✅ Contraseña del panel actualizada.');
      } catch (error) {
        passwordFormError.textContent = error.message;
      }
    });

    document.getElementById('appealsBtn').addEventListener('click', openAppealsModal);
    document.getElementById('closeAppealsModalBtn').addEventListener('click', closeAppealsModal);
    document.getElementById('cancelAppealsModalBtn').addEventListener('click', closeAppealsModal);
    appealsModal.addEventListener('click', (event) => {
      if (event.target === appealsModal) closeAppealsModal();
    });

    document.getElementById('healthBtn').addEventListener('click', openHealthModal);
    document.getElementById('refreshHealthBtn').addEventListener('click', openHealthModal);
    document.getElementById('closeHealthModalBtn').addEventListener('click', closeHealthModal);
    document.getElementById('cancelHealthModalBtn').addEventListener('click', closeHealthModal);
    healthModal.addEventListener('click', (event) => {
      if (event.target === healthModal) closeHealthModal();
    });
    socket.on('health', () => {
      if (healthModal.classList.contains('open')) openHealthModal();
    });

    document.getElementById('notifyBtn').addEventListener('click', openNotifyModal);
    document.getElementById('closeNotifyModalBtn').addEventListener('click', closeNotifyModal);
    document.getElementById('cancelNotifyModalBtn').addEventListener('click', closeNotifyModal);
    notifyModal.addEventListener('click', (event) => {
      if (event.target === notifyModal) closeNotifyModal();
    });

    document.getElementById('testNotifyBtn').addEventListener('click', async () => {
      notifyFormError.textContent = '';
      try {
        const res = await fetch('/api/notifications/test', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(notifyFormData()) });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo enviar la prueba.');
        alert('✅ ' + (data.message || 'Prueba enviada. Revisa tu Telegram.'));
      } catch (error) {
        notifyFormError.textContent = error.message;
      }
    });

    notifyForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      notifyFormError.textContent = '';
      try {
        const res = await fetch('/api/notifications', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(notifyFormData()) });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || 'No se pudo guardar.');
        closeNotifyModal();
        alert('✅ Notificaciones guardadas.');
      } catch (error) {
        notifyFormError.textContent = error.message;
      }
    });

    document.getElementById('openAppealsFolderBtn').addEventListener('click', async () => {
      try {
        const res = await fetch('/api/appeals/open-folder', { method: 'POST' });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'No se pudo abrir la carpeta.');
      } catch (error) {
        alert('❌ ' + error.message);
      }
    });

    document.getElementById('deleteAllAppealsBtn').addEventListener('click', async () => {
      if (!confirm('¿Borrar TODOS los bloqueos detectados y sus capturas?')) return;
      try {
        const res = await fetch('/api/appeals', { method: 'DELETE' });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'No se pudieron borrar.');
        openAppealsModal();
      } catch (error) {
        alert('❌ ' + error.message);
      }
    });

    socket.on('block-evidence', () => {
      if (appealsModal.classList.contains('open')) openAppealsModal();
    });

    socket.on('safety-check', (data) => {
      if (!data || !data.id) return;
      const el = document.querySelector(`[data-safety-id="${data.id}"]`);
      if (!el) return;
      const r = data.result || {};
      if (data.ok) {
        el.textContent = `🛡️ OK · IP ${r.ip || '?'}${r.risk != null ? ` · riesgo ${r.risk}` : ''}${r.ipType ? ` · ${r.ipType}` : ''}${r.org ? ` · ${r.org}` : ''}`;
        el.style.color = '#2ecc71';
      } else {
        el.textContent = `🛡️ FALLÓ: ${(r.reasons || []).join(' / ')}`;
        el.style.color = '#e74c3c';
      }
    });

    addProfileForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.textContent = '';
      const form = new FormData(addProfileForm);
      const proxyHost = String(form.get('proxyHost') || '').trim();
      const body = {
        id: form.get('id'),
        port: Number(form.get('port')),
        bumpMinMinutes: Number(form.get('bumpMinMinutes')),
        bumpMaxMinutes: Number(form.get('bumpMaxMinutes')),
        url: form.get('url'),
        device: form.get('device'),
        adDetails: {
          city: form.get('adCity'),
          age: form.get('adAge'),
          text: form.get('adText'),
          photosPath: form.get('adPhotosPath')
        },
        proxy: proxyHost ? {
          host: proxyHost,
          port: Number(form.get('proxyPort')),
          username: form.get('proxyUsername'),
          password: form.get('proxyPassword'),
          type: form.get('proxyType')
        } : null
      };

      try {
        const response = await fetch('/api/profiles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'No se pudo guardar el navegador.');
        closeAddModal();
        addProfileForm.reset();
        document.getElementById('profilePort').value = '9334';
        document.getElementById('profileIntervalMin').value = '16';
        document.getElementById('profileIntervalMax').value = '16';
        document.getElementById('profileUrl').value = 'https://megapersonals.eu/';
        await loadProfiles();
      } catch (error) {
        formError.textContent = error.message;
      }
    });

    loadProfiles();
  </script>
</body>
</html>
