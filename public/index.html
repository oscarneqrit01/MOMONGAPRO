<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOMONGA PRO Multi-Browser</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-top: #0c1823;
      --bg-mid: #0f1f2b;
      --panel: rgba(14, 26, 35, 0.94);
      --panel-2: rgba(18, 33, 44, 0.96);
      --card: rgba(22, 36, 47, 0.96);
      --line: rgba(255, 255, 255, 0.08);
      --muted: #a9b9c9;
      --text: #eaf2ff;
      --green: #50d38c;
      --green-2: #2dbd73;
      --red: #f04d4d;
      --red-2: #d33d4a;
      --orange: #f29a2e;
      --orange-2: #da7e1a;
      --blue: #2c9ae9;
      --blue-2: #167fca;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      --console: rgba(8, 12, 18, 0.83);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #0d1418 0%, #182733 100%);
      color: var(--text);
    }

    body {
      padding: 0;
    }

    .phone-shell {
      width: min(100%, 1364px);
      margin: 0 auto;
      min-height: 100vh;
      padding: 0 14px 12px;
      background: linear-gradient(180deg, rgba(9, 14, 17, 0.9), rgba(37, 52, 65, 0.78));
      position: relative;
    }

    .screen {
      width: 100%;
      min-height: calc(100vh - 20px);
      background: linear-gradient(180deg, #060b13 0%, #101a22 100%);
      border-radius: 0 0 14px 14px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    }

    .statusbar {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 0 18px;
      font-weight: 700;
      background: rgba(18, 24, 30, 0.76);
      color: #fff;
      font-size: 18px;
    }

    .statusbar .time {
      letter-spacing: 0.02em;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 15px;
      color: #efefef;
    }

    .signal {
      display: flex;
      align-items: end;
      gap: 2px;
      height: 16px;
    }

    .signal span {
      width: 3px;
      border-radius: 2px 2px 0 0;
      background: #fff;
      opacity: 0.9;
      display: inline-block;
    }

    .signal span:nth-child(1) { height: 5px; }
    .signal span:nth-child(2) { height: 8px; }
    .signal span:nth-child(3) { height: 11px; }
    .signal span:nth-child(4) { height: 14px; }

    .battery {
      width: 28px;
      height: 14px;
      border: 2px solid #fff;
      border-radius: 3px;
      position: relative;
      display: inline-block;
      margin-left: 2px;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 6px;
      background: #fff;
      border-radius: 1px;
    }

    .battery::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 17px;
      height: 6px;
      background: #fff;
      border-radius: 1px;
    }

    .app-wrap {
      background: rgba(9, 17, 23, 0.96);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 18px 16px 16px;
    }

    .headerbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0 12px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      display: inline-block;
      width: 18px;
      height: 18px;
      background: linear-gradient(135deg, #65d6b3, #e6f5ff);
      border-radius: 5px;
      transform: rotate(45deg);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(101, 214, 179, 0.4);
    }

    .brand-mark::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 3px;
      background: rgba(13, 25, 35, 0.9);
    }

    .title {
      font-size: clamp(22px, 3vw, 44px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #dfeeff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title .accent {
      color: #8fe3b9;
      text-shadow: 0 0 12px rgba(143, 227, 185, 0.45);
    }

    .title .muted {
      color: #dfeeff;
    }

    .active-box {
      flex-shrink: 0;
      background: rgba(21, 47, 39, 0.85);
      border: 1px solid rgba(116, 223, 166, 0.42);
      color: #a6e7b8;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .control-label {
      font-size: 14px;
      color: #dfeeff;
      letter-spacing: 0.12em;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.9;
      margin-right: 6px;
    }

    .btn {
      appearance: none;
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      min-height: 52px;
      padding: 0 18px;
      font-size: 15px;
      text-transform: uppercase;
      transition: transform 0.15s ease, filter 0.2s ease;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.18);
    }

    .btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-start {
      background: linear-gradient(180deg, var(--green), var(--green-2));
      color: #f0fff6;
      min-width: 200px;
    }

    .btn-publish {
      background: linear-gradient(180deg, var(--red), var(--red-2));
      min-width: 230px;
    }

    .btn-pause {
      background: linear-gradient(180deg, var(--orange), var(--orange-2));
      min-width: 150px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 18px;
      margin-bottom: 12px;
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #dfeeff;
      opacity: 0.9;
    }

    .section-header .left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-header .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #dfeeff;
      opacity: 0.85;
      display: inline-block;
    }

    .add-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.12);
      color: #edf4ff;
      border-radius: 10px;
      min-height: 42px;
      padding: 0 18px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 14px;
    }

    .profiles {
      display: block;
      margin-top: 4px;
    }

    .profile-card {
      background: linear-gradient(180deg, rgba(15, 27, 37, 0.96), rgba(12, 23, 32, 0.96));
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: 140px;
      padding: 14px 18px;
      margin-bottom: 18px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .profile-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .profile-name {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: nowrap;
    }

    .profile-name strong {
      font-size: clamp(16px, 1.9vw, 26px);
      font-weight: 800;
      letter-spacing: 0.01em;
      color: #f3f7ff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #a9b9c9;
      font-size: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .mini-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6be3ad;
      display: inline-block;
      box-shadow: 0 0 12px rgba(107, 227, 173, 0.8);
      margin-right: 4px;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .small-btn {
      border: none;
      border-radius: 8px;
      min-height: 34px;
      padding: 0 16px;
      color: #fff;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      letter-spacing: 0.04em;
      font-size: 12px;
    }

    .small-btn.green { background: linear-gradient(180deg, #46c876, #2bb069); }
    .small-btn.orange { background: linear-gradient(180deg, #f7a42d, #df891d); }
    .small-btn.red { background: linear-gradient(180deg, #ef5658, #d5413d); }
    .small-btn.blue { background: linear-gradient(180deg, #2ea5ec, #147fe0); }

    .subpanel {
      margin-top: 18px;
      background: linear-gradient(180deg, rgba(15, 27, 37, 0.95), rgba(12, 24, 32, 0.99));
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 18px 14px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    }

    .subpanel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .subpanel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #eaf2ff;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 15px;
    }

    .subpanel-title .small-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9fd9ff;
      display: inline-block;
    }

    .subpanel-meta {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
      color: #d7ebff;
      font-size: 13px;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #eaf2ff;
      font-weight: 700;
    }

    .meta-pill .tiny {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f4d460;
      display: inline-block;
      box-shadow: 0 0 10px rgba(244,212,96,0.8);
    }

    .timer-wrap {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 10px;
      padding: 8px 0 4px;
    }

    .timer-label {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: #d7e7ff;
      text-transform: uppercase;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .timer {
      font-size: clamp(30px, 3.3vw, 62px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.06em;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #e9f7ff;
      text-shadow: 0 0 15px rgba(255,255,255,0.1);
    }

    .note {
      color: #dfeeff;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.9;
    }

    .checks {
      margin-top: 16px;
      display: grid;
      gap: 8px;
      color: #dfeeff;
      font-size: 15px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.96;
    }

    .check-item input {
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.45);
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 18px;
      cursor: pointer;
    }

    .check-item input:checked {
      background: rgba(87, 224, 167, 0.18);
      border-color: rgba(87, 224, 167, 0.7);
    }

    .check-item input:checked::after {
      content: "";
      width: 5px;
      height: 9px;
      width: 5px;
      border: solid #6fe5b0;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .actions-bottom {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .small-btn.action-green { background: linear-gradient(180deg, #46c876, #2bb069); }
    .small-btn.action-orange { background: linear-gradient(180deg, #f7a42d, #df891d); }
    .small-btn.action-red { background: linear-gradient(180deg, #ef5658, #d5413d); }
    .small-btn.action-blue { background: linear-gradient(180deg, #2ea5ec, #147fe0); }

    .logbox {
      margin-top: 18px;
      background: var(--console);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 12px 10px;
      min-height: 126px;
      max-height: 200px;
      overflow: hidden;
    }

    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #dce9ff;
      opacity: 0.85;
    }

    .log-list {
      font-family: "Consolas", "Monaco", monospace;
      font-size: 12px;
      line-height: 1.7;
      color: #d6ffdb;
      max-height: 152px;
      overflow: auto;
      padding-right: 6px;
    }

    .log-list div {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .clear-log {
      border: none;
      background: transparent;
      color: #dfeeff;
      cursor: pointer;
      font-weight: 700;
      opacity: 0.8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 11px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.72);
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      width: min(520px, 100%);
      max-height: 90vh;
      overflow: auto;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #142532;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .modal-header h2 { margin: 0; font-size: 20px; }

    .modal-close {
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 24px;
      cursor: pointer;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-field { display: grid; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .form-field input {
      width: 100%;
      min-height: 40px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0b1720;
      color: var(--text);
      outline: none;
    }
    .form-field input:focus { border-color: #5acb9b; }
    .form-error { min-height: 20px; margin-top: 12px; color: #ff9d9d; font-size: 13px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .modal-actions button {
      min-height: 40px;
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .cancel-btn { background: rgba(255,255,255,0.12); }
    .save-btn { background: linear-gradient(180deg, var(--green), var(--green-2)); }

    @media (max-width: 980px) {
      .title {
        white-space: normal;
      }

      .title-group {
        flex-wrap: wrap;
      }

      .control-row {
        justify-content: flex-start;
      }

      .btn-start, .btn-publish, .btn-pause {
        min-width: 0;
        flex: 1 1 180px;
      }
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="screen">
      <div class="statusbar">
        <div class="time">8:46 <span style="font-weight: 400; font-size: 16px;">◔</span></div>
        <div class="status-icons">
          <div class="signal" aria-label="signal">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="battery" aria-label="battery"></div>
        </div>
      </div>

      <div class="app-wrap">
        <div class="headerbar">
          <div class="title-group">
            <div class="brand-mark"></div>
            <div class="title"><span class="muted">MOMONGA PRO</span> <span class="accent">Multi-Browser</span></div>
          </div>
          <div class="active-box" id="active-count">0 Navegadores Activos</div>
        </div>

        <div class="control-row">
          <div class="control-label">Control:</div>
          <button class="btn btn-start" id="startAllBtn">Iniciar todos</button>
          <button class="btn btn-publish" id="publishAllBtn">Publicar en todos</button>
          <button class="btn btn-pause" id="pauseAllBtn">Pausar</button>
        </div>

        <div class="section-header">
          <div class="left"><span class="dot"></span> Navegadores configurados:</div>
          <button class="add-btn" type="button">+ Agregar navegador</button>
        </div>

        <div id="profiles" class="profiles"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="addModal" role="dialog" aria-modal="true" aria-labelledby="addModalTitle">
    <form class="modal" id="addProfileForm">
      <div class="modal-header">
        <h2 id="addModalTitle">Agregar navegador</h2>
        <button class="modal-close" id="closeModalBtn" type="button" aria-label="Cerrar">&times;</button>
      </div>
      <div class="form-grid">
        <div class="form-field">
          <label for="profileId">Nombre</label>
          <input id="profileId" name="id" placeholder="Ej. Amberb82842" required />
        </div>
        <div class="form-field">
          <label for="profilePort">Puerto Chrome</label>
          <input id="profilePort" name="port" type="number" min="1024" max="65535" value="9334" required />
        </div>
        <div class="form-field">
          <label for="profileInterval">Intervalo (minutos)</label>
          <input id="profileInterval" name="intervalMinutes" type="number" min="1" value="16" required />
        </div>
        <div class="form-field">
          <label for="profileUrl">URL</label>
          <input id="profileUrl" name="url" value="https://megapersonals.eu/" required />
        </div>
        <div class="form-field full">
          <label for="profileProxyHost">Proxy host (opcional)</label>
          <input id="profileProxyHost" name="proxyHost" placeholder="92.113.183.190" />
        </div>
        <div class="form-field">
          <label for="profileProxyPort">Proxy port</label>
          <input id="profileProxyPort" name="proxyPort" type="number" min="1" placeholder="45398" />
        </div>
        <div class="form-field">
          <label for="profileProxyUser">Proxy usuario</label>
          <input id="profileProxyUser" name="proxyUsername" />
        </div>
        <div class="form-field full">
          <label for="profileProxyPassword">Proxy contraseña</label>
          <input id="profileProxyPassword" name="proxyPassword" type="password" />
        </div>
        <div class="form-field full">
          <label for="adCity">Ciudad del anuncio</label>
          <input id="adCity" name="adCity" placeholder="Montreal" />
        </div>
        <div class="form-field">
          <label for="adAge">Edad</label>
          <input id="adAge" name="adAge" type="number" min="18" placeholder="25" />
        </div>
        <div class="form-field">
          <label for="adPhotosPath">Carpeta de fotos</label>
          <input id="adPhotosPath" name="adPhotosPath" placeholder="./photos/amber/" />
        </div>
        <div class="form-field full">
          <label for="adText">Texto exacto del anuncio</label>
          <textarea id="adText" name="adText" rows="4" style="width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:#0b1720; color:var(--text); resize:vertical;"></textarea>
        </div>
      </div>
      <div class="form-error" id="formError" role="alert"></div>
      <div class="modal-actions">
        <button class="cancel-btn" id="cancelModalBtn" type="button">Cancelar</button>
        <button class="save-btn" type="submit">Guardar navegador</button>
      </div>
    </form>
  </div>

  <script>
    const socket = io();
    const profileStates = {};
    const profileStats = {};
    const profileRepostTimers = {};
    const profilesEl = document.getElementById('profiles');
    const activeCountEl = document.getElementById('active-count');
    const addModal = document.getElementById('addModal');
    const addProfileForm = document.getElementById('addProfileForm');
    const formError = document.getElementById('formError');

    function openAddModal() {
      formError.textContent = '';
      addModal.classList.add('open');
      document.getElementById('profileId').focus();
    }

    function closeAddModal() {
      addModal.classList.remove('open');
    }

    async function loadProfiles() {
      try {
        const response = await fetch('/api/profiles');
        const profiles = await response.json();
        renderProfiles(profiles);
      } catch (error) {
        console.error('Error cargando perfiles:', error);
      }
    }

                    <button onclick="scrapeActiveAd('${profile.id}')" style="background: #3498db; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px;">📥 Copiar Datos del Post Actual</button>

      for (const id of Object.keys(profileStates)) updateProfileState(id, profileStates[id]);
      for (const id of Object.keys(profileStats)) updateStats(id, profileStats[id]);
      for (const id of Object.keys(profileRepostTimers)) updateRepostTimer(id, profileRepostTimers[id]);

      profilesEl.querySelectorAll('[data-action]').forEach(button => {
        button.addEventListener('click', () => {
          const id = button.dataset.id;
          const action = button.dataset.action;

          if (action === 'open') socket.emit('open-profile', id);
          if (action === 'start') socket.emit('start-profile', id);
          if (action === 'pause') socket.emit('pause-profile', id);
          if (action === 'stop') socket.emit('stop-profile', id);
          if (action === 'publish') socket.emit('publish-profile', id);
        });
      });

          const log = document.querySelector(`[data-log-id="${id}"]`);
          if (log) log.innerHTML = '';
        });
      });

      profilesEl.querySelectorAll('[data-setting]').forEach(input => {
        input.addEventListener('change', async () => {
          const profileId = input.dataset.id;
          const settings = {};
          profilesEl.querySelectorAll(`[data-setting][data-id="${profileId}"]`).forEach(option => {
            settings[option.dataset.setting] = option.checked;
          });

          try {
            const response = await fetch(`/api/profiles/${encodeURIComponent(profileId)}/settings`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(settings)
            });
            if (!response.ok) {
              const result = await response.json();
              throw new Error(result.error || 'No se pudo guardar la opción.');
            }
          } catch (error) {
            input.checked = !input.checked;
            console.error(error.message);
          }
        });
      });
    }

    function toggleConfig(profileId) {
      const body = document.getElementById(`config-body-${profileId}`);
      const icon = document.getElementById(`toggle-icon-${profileId}`);
      if (!body || !icon) return;
      if (body.style.display === 'none') {
        body.style.display = 'block';
        icon.innerText = '▼ Minimizar';
      } else {
        body.style.display = 'none';
        icon.innerText = '▶ Mostrar Configuración';
      }
    }

    async function deleteProfile(profileId) {
      if (!confirm(`¿Estás seguro de eliminar el perfil ${profileId}? Se borrarán sus datos asociados del panel.`)) return;
      try {
        const res = await fetch(`/api/profiles/${profileId}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          alert('🗑️ Perfil eliminado correctamente.');
          loadProfiles(); // Recargar la lista
        } else {
          alert('❌ No se pudo eliminar el perfil.');
        }
      } catch (e) {
        console.error(e);
        alert('❌ Error de red al eliminar.');
      }
    }

    async function scrapeActiveAd(profileId) {
      alert('📥 Leyendo la página actual (SOLO LECTURA). Abre primero el anuncio en la ventana del navegador para copiar sus datos.');
      try {
        const res = await fetch(`/api/profiles/${encodeURIComponent(profileId)}/scrape`, { method: 'POST' });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || 'No se pudieron copiar los datos.');

        const { name, headline, city, age, location, phone, text, photosPath, photosSaved } = result.data || {};
        if (name) document.getElementById(`name-${profileId}`).value = name;
        if (headline) document.getElementById(`headline-${profileId}`).value = headline;
        if (city) document.getElementById(`city-${profileId}`).value = city;
        if (age) document.getElementById(`age-${profileId}`).value = age;
        if (location) document.getElementById(`location-${profileId}`).value = location;
        if (phone) document.getElementById(`phone-${profileId}`).value = phone;
        if (text) document.getElementById(`text-${profileId}`).value = text;
        if (photosPath) document.getElementById(`photos-${profileId}`).value = photosPath;
        if (photosSaved) alert(`📥 ${photosSaved} foto(s) copiadas y blindadas. Revisa y pulsa Guardar Cambios.`);
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }

    function applyRepostToggle(profileId, active) {
      const btn = document.getElementById(`btn-repost-toggle-${profileId}`);
      if (!btn) return;
      btn.dataset.active = active ? 'true' : 'false';
      btn.style.background = active ? '#e74c3c' : '#27ae60';
      btn.innerText = active ? '⏹️ Detener Ciclo' : '▶️ Activar Ciclo';
    }

    async function toggleAutoRepost(profileId) {
      const btn = document.getElementById(`btn-repost-toggle-${profileId}`);
      const intervalInput = document.getElementById(`interval-${profileId}`);
      const interval = Number(intervalInput.value) || 6;
      const activating = btn.dataset.active !== 'true';

      try {
        const res = await fetch(`/api/profiles/${encodeURIComponent(profileId)}/autorepost`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ autoRepostActive: activating, repostInterval: interval })
        });
        const result = await res.json();
        if (!result.success) throw new Error(result.error || 'No se pudo actualizar el ciclo.');
        applyRepostToggle(profileId, result.autoRepostActive);
      } catch (e) {
        alert('❌ ' + e.message);
      }
    }

    async function saveProfileConfig(profileId) {
      const data = {
        proxy: document.getElementById(`proxy-${profileId}`).value,
        apiKey2Captcha: document.getElementById(`cap-${profileId}`).value,
        email: document.getElementById(`email-${profileId}`).value,
        password: document.getElementById(`pass-${profileId}`).value,
        adDetails: {
          name: document.getElementById(`name-${profileId}`).value,
          headline: document.getElementById(`headline-${profileId}`).value,
          city: document.getElementById(`city-${profileId}`).value,
          age: document.getElementById(`age-${profileId}`).value,
          location: document.getElementById(`location-${profileId}`).value,
          phone: document.getElementById(`phone-${profileId}`).value,
          photosPath: document.getElementById(`photos-${profileId}`).value,
          text: document.getElementById(`text-${profileId}`).value
        }
      };

      try {
        const res = await fetch(`/api/profiles/${profileId}/settings`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        if (result.success) {
          alert('✅ ¡Configuración guardada y actualizada con éxito!');
        } else {
          alert('❌ Error al guardar.');
        }
      } catch (e) {
        console.error(e);
        alert('❌ Error de red al guardar la configuración.');
      }
    }

    socket.on('connect', () => {
      loadProfiles();
    });

    socket.on('timer', (data) => {
      const timerNode = document.querySelector(`[data-timer-id="${data.id}"]`);
      if (timerNode) timerNode.textContent = data.time || '--:--';
    });

    function updateRepostTimer(profileId, time) {
      profileRepostTimers[profileId] = time;
      const node = document.querySelector(`[data-repost-timer-id="${profileId}"]`);
      if (node) node.textContent = time || '--:--';
    }

    socket.on('repost-timer', (data) => {
      updateRepostTimer(data.id, data.time);
    });

    socket.on('log', (data) => {
      const logBox = document.querySelector(`[data-log-id="${data.id}"]`);
      if (logBox) {
        const line = document.createElement('div');
        const stamp = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        line.textContent = `[${stamp}] ${data.text}`;
        logBox.appendChild(line);
        logBox.scrollTop = logBox.scrollHeight;
      }
    });

    socket.on('active-count', (data) => {
      activeCountEl.textContent = `${data.active} Navegadores Activos`;
    });

    socket.on('profiles-updated', (profiles) => {
      renderProfiles(profiles);
    });

    function updateProfileState(profileId, state) {
      profileStates[profileId] = state;
      const card = document.querySelector(`[data-card-id="${profileId}"]`);
      if (!card) return;

      const labels = { running: '● Activo', paused: '● Pausado', ready: '● Abierto', stopped: '● Detenido' };
      const colors = { running: '#4ecca3', paused: '#f5a623', ready: '#6c5ce7', stopped: '#888' };
      const badge = card.querySelector(`[data-state-id="${profileId}"]`);
      if (badge) {
        badge.textContent = labels[state] || labels.stopped;
        badge.style.color = colors[state] || colors.stopped;
      }

      const hasBrowser = state !== 'stopped';
      card.querySelectorAll('[data-action="open"]').forEach(btn => { btn.disabled = hasBrowser; });
      card.querySelectorAll('[data-action="start"]').forEach(btn => { btn.disabled = state === 'running'; });
      card.querySelectorAll('[data-action="pause"]').forEach(btn => {
        btn.disabled = state === 'stopped' || state === 'ready';
        btn.textContent = state === 'paused' ? 'Reanudar' : 'Pausar';
      });
      card.querySelectorAll('[data-action="stop"]').forEach(btn => { btn.disabled = state === 'stopped'; });
      card.querySelectorAll('[data-action="publish"]').forEach(btn => { btn.disabled = state === 'stopped' || state === 'ready'; });
    }

    function updateStats(profileId, stats) {
      profileStats[profileId] = stats;
      const pill = document.querySelector(`[data-stats-id="${profileId}"]`);
      if (pill) {
        pill.textContent = `Bumps hoy: ${stats.bumpsToday || 0} · Total: ${stats.totalBumps || 0}`;
      }
      const note = document.querySelector(`[data-lastbump-id="${profileId}"]`);
      if (note) {
        note.textContent = stats.lastBumpAt
          ? `Último bump: ${new Date(stats.lastBumpAt).toLocaleString()}`
          : 'Sin publicaciones registradas aún';
      }
    }

    socket.on('profile-state', (data) => {
      updateProfileState(data.id, data.state);
    });

    socket.on('stats', (data) => {
      updateStats(data.id, data.stats);
    });

    function showEmergencyBanner(reason) {
      let banner = document.getElementById('emergency-banner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'emergency-banner';
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#e74c3c;color:#fff;padding:14px 16px;text-align:center;font-weight:bold;font-size:15px;box-shadow:0 4px 14px rgba(0,0,0,.5);';
        document.body.appendChild(banner);
      }
      banner.textContent = `🚨 PARADA DE EMERGENCIA — ${reason} — Todos los perfiles detenidos.`;
      clearTimeout(banner._hideTimer);
      banner._hideTimer = setTimeout(() => banner.remove(), 30000);
    }

    socket.on('emergency-stop', (data) => {
      showEmergencyBanner((data && data.reason) || 'Bloqueo detectado');
    });

    document.getElementById('startAllBtn').addEventListener('click', () => {
      socket.emit('start-all');
    });

      socket.emit('publish-all');
    });

    document.getElementById('pauseAllBtn').addEventListener('click', () => {
      socket.emit('pause-all');
    });

    document.querySelector('.add-btn').addEventListener('click', openAddModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeAddModal);
    document.getElementById('cancelModalBtn').addEventListener('click', closeAddModal);
    addModal.addEventListener('click', (event) => {
      if (event.target === addModal) closeAddModal();
    });

    addProfileForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      formError.textContent = '';
      const form = new FormData(addProfileForm);
      const proxyHost = String(form.get('proxyHost') || '').trim();
      const body = {
        id: form.get('id'),
        port: Number(form.get('port')),
        intervalMinutes: Number(form.get('intervalMinutes')),
        url: form.get('url'),
        adDetails: {
          city: form.get('adCity'),
          age: form.get('adAge'),
          text: form.get('adText'),
          photosPath: form.get('adPhotosPath')
        },
        proxy: proxyHost ? {
          host: proxyHost,
          port: Number(form.get('proxyPort')),
          username: form.get('proxyUsername'),
          password: form.get('proxyPassword')
        } : null
      };

      try {
        const response = await fetch('/api/profiles', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'No se pudo guardar el navegador.');
        closeAddModal();
        addProfileForm.reset();
        document.getElementById('profilePort').value = '9334';
        document.getElementById('profileInterval').value = '16';
        document.getElementById('profileUrl').value = 'https://megapersonals.eu/';
        await loadProfiles();
      } catch (error) {
        formError.textContent = error.message;
      }
    });

    loadProfiles();
  </script>
</body>
</html>
